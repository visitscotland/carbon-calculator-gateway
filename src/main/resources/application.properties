spring.application.name=vs-carbon-calculator-gateway
spring.mvc.log-resolved-exception=false

#Allowed origins (Production Only)
allowed_origin=https://develop-brc-support.visitscotland.org,\
  https://release-brc-support.visitscotland.org,\
  https://support.visitscotland.org
metrics.enabled=false

# Recaptcha properties
recaptcha.enabled=true
recaptcha.publickey=${RECAPTCHA_PUBLIC:no-key}
recaptcha.secretkey=${RECAPTCHA_PRIVATE:no-key}

#Breg configuration
# breg.base-url=https://api.visitscotland.com/test/submit/breg
breg.base-url=http://172.28.81.65:8081/
breg.service-url=${breg.base-url}/form/stakeholder
breg.health-url=${breg.base-url}/health
breg.remove-properties=tourismBusiness,inScotland,emissionsUpdate,terms,handover,answerOne,answerTwo,\
  answerThree,answerFour,
breg.enabled=true

#Isla Integration configuration
trace-api.enabled=true
trace-api.base-url=https://api.staging.traceyour.events/v2
trace-api.remove-properties=g-recaptcha-response,activity_description,activity_source,activity_code,\
  consents,consentList,tourismBusiness,inScotland,newsletter,support_newsletter,emissionsUpdate,terms,handover,\
  answerOne,answerTwo,answerThree,answerFour,business_support_hub
trace-api.api-key=${TRACE_API_KEY:no-key}

#Mail
spring.mail.host=mail.visitscotland.com
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true
notification.email.enabled=true
notification.email.subject=Carbon Calculator Error Report
notification.email.recipients=
notification.email.sender=noreply@visitscotland.com




